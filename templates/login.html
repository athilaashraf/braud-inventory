<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Braud Clothing</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: Arial, sans-serif; padding: 16px;
      background: linear-gradient(135deg, #16243b 0%, #2c4a73 100%);
    }
    .login { background: #fff; width: 100%; max-width: 380px; padding: 36px 30px; border-radius: 14px;
             box-shadow: 0 12px 40px rgba(0, 0, 0, .3); }
    .logo { width: 56px; height: 56px; border-radius: 50%; background: #16243b; color: #fff;
            font-size: 28px; font-weight: bold; display: flex; align-items: center;
            justify-content: center; margin: 0 auto 14px; }
    h1 { text-align: center; margin: 0; font-size: 24px; color: #16243b; }
    .sub { text-align: center; color: #667; margin: 6px 0 24px; font-size: 14px; }
    label { display: block; font-size: 14px; font-weight: bold; color: #16243b; margin-bottom: 6px; }
    .field { margin-bottom: 18px; position: relative; }
    input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #c9d2dc; border-radius: 8px; }
    input:focus { outline: 3px solid #bcd0ea; border-color: #16243b; }
    .eye { position: absolute; right: 6px; bottom: 6px; background: none; border: 0; cursor: pointer;
           padding: 6px 8px; font-size: 18px; color: #16243b; border-radius: 6px; }
    .eye:hover { background: #eef2f6; }
    .btn { width: 100%; padding: 13px; font-size: 16px; font-weight: bold; color: #fff; background: #16243b;
           border: 0; border-radius: 8px; cursor: pointer; transition: background .15s; }
    .btn:hover { background: #24406a; }
    .btn:disabled { background: #7a8696; cursor: wait; }
    .error { background: #fdecea; color: #a93226; border-left: 4px solid #c0392b; padding: 10px 12px;
             border-radius: 6px; margin-bottom: 18px; font-size: 14px; animation: shake .35s; }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .foot { text-align: center; color: #8a95a5; font-size: 12px; margin: 20px 0 0; }
    @media (prefers-reduced-motion: reduce) { .error { animation: none; } }
            .logo-img { display: block; max-width: 160px; max-height: 160px; width: auto; height: auto; margin: 0 auto 14px; border-radius: 14px; }
  </style>
</head>
<body>
  <main class="login">
    <img class="logo-img" src="{{ url_for('static', filename='logo.png') }}" alt="Braud Clothing logo">
    <h1>Welcome back</h1>
<p class="sub">Log in to manage stock and billing</p>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="error" role="alert">{{ m }}</div>{% endfor %}
    {% endwith %}

    <form method="POST" id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" autofocus required>
      </div>

      <div class="field">
        <label for="pw">Password</label>
        <input id="pw" name="password" type="password" autocomplete="current-password"
               style="padding-right:48px" required>
        <button type="button" class="eye" id="toggle" aria-label="Show password">👁</button>
      </div>

      <button class="btn" type="submit" id="submit">Log in</button>
    </form>

    <p class="foot">Authorised users only</p>
  </main>

  <script>
    const pw = document.getElementById("pw");
    const toggle = document.getElementById("toggle");

    toggle.addEventListener("click", function () {
      const hidden = pw.type === "password";
      pw.type = hidden ? "text" : "password";
      toggle.textContent = hidden ? "🙈" : "👁";
      toggle.setAttribute("aria-label", hidden ? "Hide password" : "Show password");
    });

    document.getElementById("loginForm").addEventListener("submit", function () {
      const b = document.getElementById("submit");
      b.disabled = true;
      b.textContent = "Logging in...";
    });
  </script>
</body>
</html>
