<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Braud Clothing</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
    nav { background: #16243b; padding: 14px 24px; }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
nav a { color: #fff; text-decoration: none; white-space: nowrap; }
nav .logout { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
    .box { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    input, select { padding: 8px; margin: 4px 8px 4px 0; }
    button { padding: 9px 18px; background: #16243b; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
    .msg { padding: 10px; background: #e8f3ff; border-left: 4px solid #16243b; margin-bottom: 12px; }
        .hello { margin: 8px 0 0; }
    .subtle { color: #667; margin: 4px 0 20px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat { background: #fff; border-radius: 10px; padding: 18px; text-decoration: none; color: #16243b; display: flex; flex-direction: column; border-left: 5px solid #16243b; transition: transform .15s, box-shadow .15s; }
    .stat .num { font-size: 32px; font-weight: bold; }
    .stat.warn { border-left-color: #c0392b; }
    .stat.warn .num { color: #c0392b; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .tile { background: #fff; border-radius: 10px; padding: 24px 18px; text-decoration: none; color: #16243b; display: flex; flex-direction: column; gap: 6px; transition: transform .15s, box-shadow .15s; }
    .tile .ico { font-size: 34px; }
    .tile b { font-size: 18px; }
    .tile small { color: #667; }
    .stat:hover, .tile:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(22, 36, 59, .15); }
    .tile:focus-visible, .stat:focus-visible { outline: 3px solid #16243b; }
        nav .brand { display: inline-flex; align-items: center; margin-right: 10px; }
    nav .brand img { height: 36px; width: auto; border-radius: 6px; display: block; }
  </style>
</head>
<body>
  <nav>
    <nav>
  {% if session.get("logged_in") %}
  <a href="/" class="brand" aria-label="Braud Clothing home">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Braud Clothing">
  </a>
  <a href="/">Home</a>
  <a href="/dashboard">Stock Status</a>
  <a href="/products">Products</a>
  <a href="/stock">Add Stock</a>
  <a href="/adjust">Correct Stock</a>
  <a href="/billing">Billing</a>
  <a href="/invoices">Invoices</a>
  <a href="/logout" class="logout">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
    Log out
  </a>
  {% else %}
  <span style="color:#fff">Braud Clothing</span>
  {% endif %}
</nav> 
 </nav>
  <div class="box">
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
