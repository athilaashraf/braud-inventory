{% extends "base.html" %}
{% block content %}

<div class="card">
  <h2>Edit {{ product.name }}</h2>
  <form method="POST">
    <p><label>Price per shirt<br>
      <input name="price" type="number" step="0.01" min="0.01" value="{{ product.price }}" required>
    </label></p>
    <p><label>Warn when stock is below<br>
      <input name="low_stock_limit" type="number" min="0" value="{{ product.low_stock_limit }}" required>
    </label></p>
    <button type="submit">Save changes</button>
    <a href="/products" style="margin-left:12px">Cancel</a>
  </form>
  <p style="color:#666">Bills already saved keep the price they were made with.</p>
</div>

{% endblock %}
